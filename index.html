<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#0d100d">
	<title>大荒医者 · 快穿之我在山海经当大夫</title>
	<style>
		:root {
			--ink: #171511;
			--paper: #efe6d2;
			--paper-deep: #d8c8aa;
			--cinnabar: #9c2a21;
			--muted: #786b58;
		}
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			border: 0;
			overflow: hidden;
			background: #0b0d0b;
			touch-action: none;
			font-family: "KaiTi", "STKaiti", "Noto Serif SC", serif;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			outline: none;
		}
		#status {
			position: fixed;
			inset: 0;
			z-index: 20;
			display: flex;
			align-items: center;
			justify-content: center;
			background:
				radial-gradient(circle at 50% 42%, rgba(220, 206, 176, 0.14), transparent 36%),
				radial-gradient(circle at 50% 50%, #252a23 0%, #111410 58%, #070907 100%);
			transition: opacity 0.65s ease, visibility 0.65s ease;
		}
		#status.hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}
		#status::before,
		#status::after {
			content: "";
			position: absolute;
			inset: 0;
			pointer-events: none;
		}
		#status::before {
			background:
				radial-gradient(ellipse at 12% 82%, rgba(44, 62, 48, 0.42), transparent 34%),
				radial-gradient(ellipse at 86% 16%, rgba(53, 57, 45, 0.38), transparent 30%);
		}
		#status::after {
			box-shadow: inset 0 0 150px 36px rgba(0, 0, 0, 0.70);
		}
		.loading-card {
			position: relative;
			z-index: 2;
			width: min(620px, 84vw);
			padding: 46px 54px 38px;
			box-sizing: border-box;
			text-align: center;
			color: var(--paper);
			background:
				linear-gradient(135deg, rgba(239, 230, 210, 0.05), rgba(239, 230, 210, 0.01)),
				rgba(10, 13, 10, 0.54);
			border: 1px solid rgba(213, 191, 148, 0.28);
			border-radius: 4px;
			box-shadow:
				0 24px 80px rgba(0, 0, 0, 0.48),
				inset 0 0 0 6px rgba(213, 191, 148, 0.035);
			backdrop-filter: blur(5px);
		}
		.loading-card::before,
		.loading-card::after {
			content: "";
			position: absolute;
			left: 24px;
			right: 24px;
			height: 1px;
			background: linear-gradient(90deg, transparent, rgba(208, 184, 137, 0.52), transparent);
		}
		.loading-card::before { top: 20px; }
		.loading-card::after { bottom: 20px; }
		.eyebrow {
			font-size: 13px;
			letter-spacing: 0.42em;
			color: rgba(232, 219, 191, 0.62);
		}
		h1 {
			margin: 16px 0 8px;
			font-size: clamp(42px, 6vw, 68px);
			font-weight: 400;
			letter-spacing: 0.18em;
			text-indent: 0.18em;
			color: #f4eddc;
			text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
		}
		.subtitle {
			font-size: 17px;
			letter-spacing: 0.14em;
			color: rgba(236, 223, 196, 0.78);
		}
		.rule {
			width: 92px;
			height: 1px;
			margin: 26px auto 22px;
			background: linear-gradient(90deg, transparent, #c9aa70, transparent);
		}
		#loading-label {
			font-size: 15px;
			letter-spacing: 0.18em;
			color: rgba(229, 216, 189, 0.72);
		}
		#status-progress {
			display: block;
			width: min(360px, 70vw);
			height: 5px;
			margin: 16px auto 10px;
			appearance: none;
			border: 0;
			background: rgba(226, 207, 169, 0.14);
			border-radius: 99px;
			overflow: hidden;
		}
		#status-progress::-webkit-progress-bar {
			background: rgba(226, 207, 169, 0.14);
			border-radius: 99px;
		}
		#status-progress::-webkit-progress-value {
			background: linear-gradient(90deg, #7f8f72, #c9b27d);
			border-radius: 99px;
			transition: width 0.2s ease;
		}
		#status-progress::-moz-progress-bar {
			background: linear-gradient(90deg, #7f8f72, #c9b27d);
			border-radius: 99px;
		}
		#loading-percent {
			min-height: 18px;
			font-size: 12px;
			letter-spacing: 0.14em;
			color: rgba(222, 206, 174, 0.54);
		}
		#status-notice {
			display: none;
			margin: 18px auto 0;
			padding: 12px 14px;
			max-width: 520px;
			font-family: Arial, "Microsoft YaHei", sans-serif;
			font-size: 13px;
			line-height: 1.6;
			color: #f0d9d2;
			background: rgba(72, 24, 25, 0.62);
			border: 1px solid rgba(182, 91, 83, 0.48);
			border-radius: 4px;
		}
		.hint {
			margin-top: 20px;
			font-size: 12px;
			letter-spacing: 0.08em;
			color: rgba(217, 202, 171, 0.42);
		}
		@media (max-width: 680px) {
			.loading-card { padding: 36px 26px 30px; }
			h1 { letter-spacing: 0.10em; text-indent: 0.10em; }
			.subtitle { font-size: 14px; }
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">你的浏览器不支持 Canvas，请使用较新的 Edge、Chrome 或 Safari。</canvas>

	<div id="status">
		<div class="loading-card">
			<div class="eyebrow">山海经 · 大荒卷</div>
			<h1>大荒医简</h1>
			<div class="subtitle">快穿之我在山海经当医师</div>
			<div class="rule"></div>
			<div id="loading-label">正在展开山海舆图</div>
			<progress id="status-progress"></progress>
			<div id="loading-percent">0%</div>
			<div id="status-notice"></div>
			<div class="hint">建议使用 Edge / Chrome，横屏窗口进入大荒</div>
		</div>
	</div>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":82163480,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		let gamePackUrl = "";

		(function () {
			const status = document.getElementById("status");
			const label = document.getElementById("loading-label");
			const progress = document.getElementById("status-progress");
			const percent = document.getElementById("loading-percent");
			const notice = document.getElementById("status-notice");

			function hideLoading() {
				status.classList.add("hidden");
				setTimeout(() => status.remove(), 750);
			}

			function showFailure(err) {
				console.error(err);
				label.textContent = "未能展开舆图";
				percent.textContent = "";
				progress.style.display = "none";
				notice.style.display = "block";
				if (err instanceof Error) {
					notice.textContent = err.message;
				} else if (typeof err === "string") {
					notice.textContent = err;
				} else {
					notice.textContent = "浏览器加载游戏时发生未知错误。请刷新页面，或改用最新版 Edge / Chrome。";
				}
			}

			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length !== 0) {
				showFailure("当前浏览器缺少运行游戏所需的功能：\n" + missing.join("、"));
				return;
			}

			async function assembleGamePack() {
				const buffers = [];
				let loaded = 0;
				const total = GODOT_CONFIG.fileSizes["index.pck"];
				for (let i = 0; i < 10; i += 1) {
					const name = `_parts/index.pck.part-${String(i).padStart(2, "0")}`;
					const response = await fetch(name, { cache: "force-cache" });
					if (!response.ok) {
						throw new Error(`游戏数据段读取失败：${name}`);
					}
					const buffer = await response.arrayBuffer();
					buffers.push(buffer);
					loaded += buffer.byteLength;
					progress.value = loaded;
					progress.max = total;
					const p = Math.min(99, Math.round((loaded / total) * 100));
					percent.textContent = p + "%";
					label.textContent = p > 72 ? "正在点检药典与医案" : "正在铺展四境山川";
				}
				gamePackUrl = URL.createObjectURL(new Blob(buffers, { type: "application/octet-stream" }));
				GODOT_CONFIG.mainPack = gamePackUrl;
				delete GODOT_CONFIG.fileSizes["index.pck"];
			}

			assembleGamePack().then(() => {
				const engine = new Engine(GODOT_CONFIG);
				return engine.startGame({
					onProgress: function (current, total) {
						if (current > 0 && total > 0) {
							progress.value = current;
							progress.max = total;
							const p = Math.min(99, Math.round((current / total) * 100));
							percent.textContent = p + "%";
							label.textContent = p > 42 ? "正在点检药典与医案" : "正在铺展四境山川";
						}
					},
				});
			}).then(() => {
				percent.textContent = "100%";
				label.textContent = "大荒已至";
				setTimeout(hideLoading, 260);
			}).catch(showFailure);
		}());
	</script>
</body>
</html>
